version = "0.1.0"

[site]
title = "Oli's site"
description = "Personal website of Oli McInnes"
url = "https://oli.mcinnes.cc"

[site.params]
disable_post_glyphs = true
nav_title = "olimci"

[build]
minify = true

[content.defaults]
template = "post"
section = "page"

[content.markdown]
wikilinks = true
goldmark = { extensions = ["gfm", "table", "strikethrough", "tasklist", "deflist", "footnotes", "typographer"], parser = {auto_heading_id=true, attribute = true}, renderer = {hardbreaks = true} }

[content.git]
enabled = true
backfill = true

[redirects]
output = "_redirects"
shorten = "q"
entries = [{ from = "https://mcinnes.cc/*", to = "https://oli.mcinnes.cc/:splat", status = 301 },{ from = "http://mcinnes.cc/*", to = "https://oli.mcinnes.cc/:splat", status = 301 }, { from = "https://site-1oc.pages.dev/*", to = "https://oli.mcinnes.cc/:splat", status = 301 }, { from = "http://site-1oc.pages.dev/*", to = "https://oli.mcinnes.cc/:splat", status = 301 }]

[rss]
output = "rss.xml"
sections = ["posts"]
limit = 50
include_drafts = false

[sitemap]
output = "sitemap.xml"
include_drafts = false
