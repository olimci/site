<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Silicon Band Structure</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            :root {
                color-scheme: dark;
                --bg: #0b0d10;
                --bg-accent: #121521;
                --panel: rgba(16, 18, 23, 0.92);
                --panel-border: #2b3040;
                --text: #e7e8ee;
                --muted: #9aa0b3;
                --accent-blue: #0000ff;
                --accent-red: #ff0000;
                --slider-track: #c4c8d2;
                --slider-thumb: #f2f4f8;
                --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family:
                    "IBM Plex Mono", "SFMono-Regular", Menlo, Monaco, Consolas,
                    "Liberation Mono", "Courier New", monospace;
            }
            #app {
                position: relative;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            .panel {
                position: absolute;
                top: 16px;
                left: 16px;
                bottom: 16px;
                width: 250px;
                max-width: calc(100% - 32px);
                background: var(--panel);
                border: 1px solid var(--panel-border);
                border-radius: 0;
                padding: 12px 12px 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                box-shadow: var(--shadow);
                backdrop-filter: blur(10px);
                transition:
                    width 0.2s ease,
                    padding 0.2s ease;
                z-index: 2;
            }
            .panel.collapsed {
                display: none;
            }
            .panel-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }
            .panel-toggle-floating {
                position: absolute;
                top: 16px;
                left: 16px;
                z-index: 3;
                display: none;
            }
            .panel-toggle-floating.show {
                display: inline-flex;
            }
            .panel-content {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .panel-content > .control-row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
            }
            .panel-title {
                font-size: 14px;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .panel.collapsed .panel-title {
                display: none;
            }
            .panel.collapsed .panel-content {
                display: none;
            }
            label {
                font-size: 13px;
                color: var(--text);
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
            .panel-content > label {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .panel-content label label {
                font-size: 12px;
                color: var(--muted);
            }
            select,
            input[type="radio"] {
                font-size: 13px;
                color: var(--text);
            }
            input[type="radio"] {
                accent-color: var(--accent-blue);
            }
            input[type="checkbox"] {
                accent-color: var(--accent-red);
            }
            input[type="range"] {
                -webkit-appearance: none;
                appearance: none;
                width: 160px;
                background: transparent;
            }
            input[type="range"]::-webkit-slider-runnable-track {
                height: 4px;
                border-radius: 0;
                background: var(--slider-track);
            }
            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 14px;
                height: 14px;
                border-radius: 0;
                background: var(--slider-thumb);
                border: 2px solid #111;
                margin-top: -5px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            }
            input[type="range"]::-moz-range-track {
                height: 4px;
                border-radius: 0;
                background: var(--slider-track);
            }
            input[type="range"]::-moz-range-thumb {
                width: 14px;
                height: 14px;
                border-radius: 0;
                background: var(--slider-thumb);
                border: 2px solid #111;
            }
            #bandCount {
                font-size: 12px;
                color: var(--muted);
            }
            #bandValue {
                min-width: 2ch;
                color: var(--text);
            }
            .control-label {
                font-size: 13px;
                color: var(--text);
            }
            button {
                font-size: 12px;
                color: var(--text);
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid var(--panel-border);
                border-radius: 0;
                padding: 6px 10px;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    border-color 0.15s ease,
                    transform 0.15s ease;
            }
            button:hover {
                border-color: rgba(255, 255, 255, 0.3);
                background: rgba(255, 255, 255, 0.12);
                transform: translateY(-1px);
            }
            button.ghost {
                background: transparent;
            }
            #canvas {
                position: absolute;
                inset: 0;
            }
            #msg {
                position: absolute;
                top: 12px;
                left: 12px;
                padding: 6px 8px;
                background: rgba(0, 0, 0, 0.6);
                color: white;
                font:
                    12px/1.3 "IBM Plex Mono",
                    "SFMono-Regular",
                    Menlo,
                    Monaco,
                    Consolas,
                    "Liberation Mono",
                    "Courier New",
                    monospace;
                border-radius: 0;
                pointer-events: none;
                z-index: 3;
            }

            #bandLegends {
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 2;
            }
            .band-legend {
                position: absolute;
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 4px;
                background: rgba(10, 12, 16, 0.7);
                border: 1px solid rgba(255, 255, 255, 0.08);
                font:
                    10px "IBM Plex Mono",
                    "SFMono-Regular",
                    Menlo,
                    Monaco,
                    Consolas,
                    "Liberation Mono",
                    "Courier New",
                    monospace;
                color: var(--text);
                white-space: nowrap;
            }
            .band-legend canvas {
                display: block;
            }
            .band-legend .labels {
                display: flex;
                flex-direction: column;
                gap: 2px;
                line-height: 1.1;
                color: var(--muted);
            }

            /* Legend UI */
            #legend {
                position: absolute;
                top: 12px;
                right: 12px;
                padding: 8px;
                border-radius: 0;
                background: rgba(10, 12, 16, 0.7);
                border: 1px solid rgba(255, 255, 255, 0.08);
                color: var(--text);
                font:
                    12px "IBM Plex Mono",
                    "SFMono-Regular",
                    Menlo,
                    Monaco,
                    Consolas,
                    "Liberation Mono",
                    "Courier New",
                    monospace;
                pointer-events: none;
            }
            #legend canvas {
                display: block;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <aside id="panel" class="panel">
                <div class="panel-header">
                    <div class="panel-title">Band Structure</div>
                    <button
                        id="togglePanel"
                        class="ghost"
                        title="Collapse controls"
                    >
                        <<
                    </button>
                </div>
                <div class="panel-content">
                    <div class="control-row">
                        <span class="control-label">View:</span>
                        <label>
                            <input
                                type="radio"
                                name="view"
                                value="single"
                                checked
                            />
                            Single
                        </label>
                        <label>
                            <input type="radio" name="view" value="multi" />
                            All
                        </label>
                    </div>
                    <label id="bandControl">
                        Band:
                        <input
                            id="band"
                            type="range"
                            min="0"
                            max="0"
                            value="0"
                        />
                        <span id="bandValue">0</span>
                    </label>
                    <div class="control-row" id="bandCountRow">
                        <span class="control-label">Bands:</span>
                        <span id="bandCount">--</span>
                    </div>
                    <label
                        title="Normalize by band min/max or the global min/max across stored bands"
                    >
                        Norm:
                        <label
                            ><input
                                type="radio"
                                name="norm"
                                value="band"
                                checked
                            />
                            per-band</label
                        >
                        <label
                            ><input type="radio" name="norm" value="global" />
                            global</label
                        >
                    </label>
                    <div class="control-row" title="Slowly rotate the volume">
                        <span class="control-label">Rotation:</span>
                        <label>
                            <input type="checkbox" id="autoRotate" checked />
                            Auto
                        </label>
                        <button id="resetRotation">Reset</button>
                    </div>
                </div>
            </aside>
            <button
                id="togglePanelFloating"
                class="panel-toggle-floating"
                title="Open controls"
            >
                >>
            </button>
            <div id="canvas"></div>
        </div>

        <!-- add in <head> -->
        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
                    "three/examples/jsm/": "https://unpkg.com/three@0.159.0/examples/jsm/"
                }
            }
        </script>

        <script type="module">
            import * as THREE from "three";
            import { ArcballControls } from "three/examples/jsm/controls/ArcballControls.js";
            import { ConvexGeometry } from "three/examples/jsm/geometries/ConvexGeometry.js";
            import * as zarr from "https://cdn.jsdelivr.net/npm/zarrita@0.5.0/+esm";

            const DEFAULT_ZARR_URL = "../data/fcc_bz_bands.zarr";
            const state = {
                zarrUrl: DEFAULT_ZARR_URL,
                bandMinMax: [],
                globalMinMax: [0, 1],
                bandsStored: 0,
                nx: 0,
                ny: 0,
                nz: 0,
                kMin: new THREE.Vector3(),
                kMax: new THREE.Vector3(),
                energiesArray: null,
                maskArray: null,
                energiesView: null,
                maskView: null,
                currentBand: 0,
                normMode: "band",
                viewMode: "single",
                autoRotate: true,
                ready: false,
            };

            const bandSel = document.getElementById("band");
            const bandValue = document.getElementById("bandValue");
            const bandControl = document.getElementById("bandControl");
            const bandCountRow = document.getElementById("bandCountRow");
            const bandCount = document.getElementById("bandCount");
            const panel = document.getElementById("panel");
            const togglePanelBtn = document.getElementById("togglePanel");
            const togglePanelFloating = document.getElementById(
                "togglePanelFloating",
            );
            const autoRotateInput = document.getElementById("autoRotate");
            const resetRotationBtn = document.getElementById("resetRotation");
            let bandLegendsContainer = null;
            const bandLegends = [];
            const viewInputs = document.querySelectorAll('input[name="view"]');
            document.querySelectorAll('input[name="norm"]').forEach((r) =>
                r.addEventListener("change", (e) => {
                    state.normMode = e.target.value;
                    updateEnergyRange();
                }),
            );
            function setPanelCollapsed(collapsed) {
                panel.classList.toggle("collapsed", collapsed);
                togglePanelFloating.classList.toggle("show", collapsed);
            }

            togglePanelBtn.addEventListener("click", () => {
                setPanelCollapsed(true);
            });
            togglePanelFloating.addEventListener("click", () => {
                setPanelCollapsed(false);
            });
            setPanelCollapsed(false);
            state.autoRotate = autoRotateInput.checked;
            autoRotateInput.addEventListener("change", (e) => {
                state.autoRotate = e.target.checked;
            });
            bandSel.addEventListener("input", () => {
                setBandFromUI();
            });
            bandSel.addEventListener("change", () => {
                setBandFromUI();
            });
            viewInputs.forEach((input) => {
                input.addEventListener("change", (e) => {
                    if (e.target && e.target.checked) {
                        setViewMode(e.target.value);
                    }
                });
            });
            const container = document.getElementById("canvas");
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            const camera = new THREE.PerspectiveCamera(
                45,
                container.clientWidth / container.clientHeight,
                0.01,
                1000,
            );
            camera.position.set(0, 0, 3);

            const controls = new ArcballControls(
                camera,
                renderer.domElement,
                scene,
            );
            controls.setGizmosVisible(false);
            controls.enablePan = false;
            controls.enableRotate = false;
            controls.radiusFactor = 1.2;

            function createSliceMaterial() {
                return new THREE.ShaderMaterial({
                    glslVersion: THREE.GLSL3,
                    uniforms: {
                        u_worldToTex: { value: new THREE.Matrix4() },
                        u_volume: { value: null },
                        u_mask: { value: null },
                        u_emin: { value: 0.0 },
                        u_invRange: { value: 1.0 },
                        u_opacity: { value: 1.0 },
                    },
                    transparent: false,
                    depthWrite: true,
                    depthTest: true,
                    side: THREE.DoubleSide,
                    vertexShader: /* glsl */ `
          varying vec3 vWorldPos;
          void main() {
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldPos = worldPos.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }`,
                    fragmentShader: /* glsl */ `
          precision highp float;
          precision highp sampler3D;
          in vec3 vWorldPos;
          uniform mat4 u_worldToTex;
          uniform sampler3D u_volume;
          uniform sampler3D u_mask;
          uniform float u_emin;
          uniform float u_invRange;
          uniform float u_opacity;
          out vec4 outColor;

          vec3 colormap(float t) {
            t = clamp(t, 0.0, 1.0);
            if (t < 0.5) {
                return vec3(0.0, 0.0, 2.0*(0.5-t));
            } else {
                return vec3(2.0*(t-0.5), 0.0, 0.0);
            }
          }

          void main() {
            vec3 tc = (u_worldToTex * vec4(vWorldPos, 1.0)).xyz;
            if (any(lessThan(tc, vec3(0.0))) || any(greaterThan(tc, vec3(1.0)))) discard;

            float inBZ = texture(u_mask, tc).r;
            if (inBZ < 0.5) discard;

            float e = texture(u_volume, tc).r;
            float t = (e - u_emin) * u_invRange;
            vec3 rgb = colormap(t);
            outColor = vec4(rgb, u_opacity);
          }`,
                });
            }

            const planeGeometry = new THREE.PlaneGeometry(2, 2, 1, 1);
            const bandPlanes = [];
            const bandGroups = [];
            const bandMaterials = [];
            setViewMode(state.viewMode);

            const autoRotateAxis = new THREE.Vector3(0, 1, 0);
            const autoRotateSpeed = 0.12;
            const clock = new THREE.Clock();
            const rotationQuat = new THREE.Quaternion();
            const tempQuat = new THREE.Quaternion();
            const xAxis = new THREE.Vector3(1, 0, 0);
            const yAxis = new THREE.Vector3(0, 1, 0);

            resetRotationBtn.addEventListener("click", () => {
                rotationQuat.identity();
                applyRotationToBands();
            });

            let dragging = false,
                lastX = 0,
                lastY = 0;
            renderer.domElement.addEventListener("pointerdown", (e) => {
                dragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
            });
            renderer.domElement.addEventListener("pointerup", () => {
                dragging = false;
            });
            renderer.domElement.addEventListener("pointermove", (e) => {
                if (!dragging) return;
                const dx = (e.clientX - lastX) / 200;
                const dy = (e.clientY - lastY) / 200;
                lastX = e.clientX;
                lastY = e.clientY;
                tempQuat.setFromAxisAngle(yAxis, dx);
                rotationQuat.premultiply(tempQuat);
                tempQuat.setFromAxisAngle(xAxis, dy);
                rotationQuat.premultiply(tempQuat);
                applyRotationToBands();
            });

            function applyRotationToBands() {
                for (const group of bandGroups) {
                    group.quaternion.copy(rotationQuat);
                    group.updateMatrixWorld(true);
                }
                updateWorldToTex();
            }

            window.addEventListener("resize", () => {
                renderer.setSize(container.clientWidth, container.clientHeight);
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                fitCameraToView();
                updateBandLegendPositions();
            });

            function msg(text) {
                let m = document.getElementById("msg");
                if (!m) {
                    m = document.createElement("div");
                    m.id = "msg";
                    container.appendChild(m);
                }
                m.textContent = text;
            }

            function clearMsg() {
                const m = document.getElementById("msg");
                if (m) m.remove();
            }

            function checkWebGL2() {
                const gl = renderer.getContext();
                const ok = gl instanceof WebGL2RenderingContext;
                if (!ok) msg("WebGL2 is required. Try a newer browser.");
                return ok;
            }

            function computeWorldToTex(group) {
                const worldToVolume = new THREE.Matrix4()
                    .copy(group.matrixWorld)
                    .invert();

                const kMin = state.kMin,
                    kMax = state.kMax;
                const kCenter = new THREE.Vector3(
                    0.5 * (kMin.x + kMax.x),
                    0.5 * (kMin.y + kMax.y),
                    0.5 * (kMin.z + kMax.z),
                );
                const kHalfRange = new THREE.Vector3(
                    0.5 * (kMax.x - kMin.x),
                    0.5 * (kMax.y - kMin.y),
                    0.5 * (kMax.z - kMin.z),
                );

                const volumeToK = new THREE.Matrix4().set(
                    kHalfRange.x,
                    0,
                    0,
                    kCenter.x,
                    0,
                    kHalfRange.y,
                    0,
                    kCenter.y,
                    0,
                    0,
                    kHalfRange.z,
                    kCenter.z,
                    0,
                    0,
                    0,
                    1,
                );

                const sx = 1.0 / (kMax.x - kMin.x);
                const sy = 1.0 / (kMax.y - kMin.y);
                const sz = 1.0 / (kMax.z - kMin.z);
                const kToTex = new THREE.Matrix4().set(
                    sx,
                    0,
                    0,
                    -kMin.x * sx,
                    0,
                    sy,
                    0,
                    -kMin.y * sy,
                    0,
                    0,
                    sz,
                    -kMin.z * sz,
                    0,
                    0,
                    0,
                    1,
                );

                return kToTex.multiply(volumeToK).multiply(worldToVolume);
            }

            function updateWorldToTex() {
                if (!state.ready) return;
                for (let i = 0; i < bandMaterials.length; i++) {
                    bandMaterials[i].uniforms.u_worldToTex.value.copy(
                        computeWorldToTex(bandGroups[i]),
                    );
                }
            }

            function setPlaneSizeToCube() {
                for (const plane of bandPlanes) {
                    plane.scale.set(2, 2, 1);
                }
            }

            function updateEnergyRange() {
                for (let i = 0; i < bandMaterials.length; i++) {
                    const [emin, emax] =
                        state.normMode === "band"
                            ? state.bandMinMax[i]
                            : state.globalMinMax;
                    const invRange = 1.0 / Math.max(1e-12, emax - emin);
                    bandMaterials[i].uniforms.u_emin.value = emin;
                    bandMaterials[i].uniforms.u_invRange.value = invRange;
                }

                updateLegend();
                updateBandLegendVisibility();
            }

            function toIndex3D(x, y, z, nx, ny, nz) {
                return x + nx * (y + ny * z);
            }
            function get4DIndex(b, x, y, z, nBands, nx, ny, nz) {
                return ((b * nx + x) * ny + y) * nz + z;
            }

            function createBandTexture(band) {
                const { nx, ny, nz, energiesView } = state;
                const E = energiesView.data;
                const texData = new Float32Array(nx * ny * nz);
                for (let z = 0; z < nz; z++) {
                    for (let y = 0; y < ny; y++) {
                        for (let x = 0; x < nx; x++) {
                            const v =
                                E[
                                    get4DIndex(
                                        band,
                                        x,
                                        y,
                                        z,
                                        state.bandsStored,
                                        nx,
                                        ny,
                                        nz,
                                    )
                                ];
                            texData[toIndex3D(x, y, z, nx, ny, nz)] = isNaN(v)
                                ? 0
                                : v;
                        }
                    }
                }
                const tex = new THREE.Data3DTexture(texData, nx, ny, nz);
                tex.format = THREE.RedFormat;
                tex.type = THREE.FloatType;
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.wrapS = tex.wrapT = tex.wrapR = THREE.ClampToEdgeWrapping;
                tex.unpackAlignment = 1;
                tex.needsUpdate = true;
                return tex;
            }

            function createMaskTexture() {
                const { nx, ny, nz, maskView } = state;
                const M = maskView.data;
                const texData = new Float32Array(nx * ny * nz);
                for (let z = 0; z < nz; z++) {
                    for (let y = 0; y < ny; y++) {
                        for (let x = 0; x < nx; x++) {
                            const v = M[(x * ny + y) * nz + z];
                            texData[x + nx * (y + ny * z)] = v ? 1.0 : 0.0;
                        }
                    }
                }
                const tex = new THREE.Data3DTexture(texData, nx, ny, nz);
                tex.format = THREE.RedFormat;
                tex.type = THREE.FloatType;
                tex.minFilter = THREE.NearestFilter;
                tex.magFilter = THREE.NearestFilter;
                tex.wrapS = tex.wrapT = tex.wrapR = THREE.ClampToEdgeWrapping;
                tex.unpackAlignment = 1;
                tex.needsUpdate = true;
                return tex;
            }

            function ensureBandLegendsContainer() {
                if (!bandLegendsContainer) {
                    bandLegendsContainer = document.createElement("div");
                    bandLegendsContainer.id = "bandLegends";
                    container.appendChild(bandLegendsContainer);
                }
                return bandLegendsContainer;
            }

            function clearBandLegends() {
                if (bandLegendsContainer) {
                    bandLegendsContainer.innerHTML = "";
                }
                bandLegends.length = 0;
            }

            function buildBandLegends() {
                const legendContainer = ensureBandLegendsContainer();
                clearBandLegends();
                for (let i = 0; i < state.bandsStored; i++) {
                    const legend = document.createElement("div");
                    legend.className = "band-legend";

                    const canvas = document.createElement("canvas");
                    canvas.width = 12;
                    canvas.height = 32;
                    legend.appendChild(canvas);

                    const labels = document.createElement("div");
                    labels.className = "labels";
                    const maxLabel = document.createElement("span");
                    const minLabel = document.createElement("span");
                    labels.appendChild(maxLabel);
                    labels.appendChild(minLabel);
                    legend.appendChild(labels);

                    legendContainer.appendChild(legend);

                    const [emin, emax] = state.bandMinMax[i];
                    maxLabel.textContent = `${fmtEV(emax)} eV`;
                    minLabel.textContent = `${fmtEV(emin)} eV`;
                    drawBandLegend(canvas, emin, emax);

                    bandLegends.push({
                        el: legend,
                        canvas,
                        maxLabel,
                        minLabel,
                        emin,
                        emax,
                    });
                }
                updateBandLegendVisibility();
            }

            function updateBandLegendVisibility() {
                if (!bandLegendsContainer) return;
                const show =
                    state.normMode === "band" && state.viewMode === "multi";
                bandLegendsContainer.style.display = show ? "block" : "none";
            }

            const legendCenter = new THREE.Vector3();
            const legendRight = new THREE.Vector3();
            const legendUp = new THREE.Vector3();
            const cameraRight = new THREE.Vector3();
            const cameraUp = new THREE.Vector3();

            function updateBandLegendPositions() {
                if (
                    !bandLegendsContainer ||
                    state.normMode !== "band" ||
                    state.viewMode !== "multi" ||
                    bandLegends.length === 0
                )
                    return;

                const width = container.clientWidth;
                const height = container.clientHeight;
                const halfSize = 1;
                const offset = 8;

                cameraRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
                cameraUp.set(0, 1, 0).applyQuaternion(camera.quaternion);

                for (let i = 0; i < bandLegends.length; i++) {
                    const legend = bandLegends[i];
                    const center = bandGroups[i].position;

                    legendCenter.copy(center).project(camera);
                    const cx = (legendCenter.x * 0.5 + 0.5) * width;
                    const cy = (-legendCenter.y * 0.5 + 0.5) * height;

                    legendRight
                        .copy(center)
                        .addScaledVector(cameraRight, halfSize)
                        .project(camera);
                    const rx = (legendRight.x * 0.5 + 0.5) * width;

                    legendUp
                        .copy(center)
                        .addScaledVector(cameraUp, halfSize)
                        .project(camera);
                    const uy = (-legendUp.y * 0.5 + 0.5) * height;

                    const halfWidthPx = Math.abs(rx - cx);
                    const halfHeightPx = Math.abs(uy - cy);
                    const legendHeight = legend.el.offsetHeight || 0;
                    const x = cx + halfWidthPx + offset;
                    const y = cy - Math.max(halfHeightPx, legendHeight / 2);
                    legend.el.style.transform = `translate(${Math.round(
                        x,
                    )}px, ${Math.round(y)}px)`;
                }
            }

            function clearBands() {
                for (const plane of bandPlanes) {
                    scene.remove(plane);
                }
                for (const group of bandGroups) {
                    scene.remove(group);
                }
                bandPlanes.length = 0;
                bandGroups.length = 0;
                bandMaterials.length = 0;
                clearBandLegends();
            }

            function buildBands(maskTexture) {
                clearBands();
                for (let i = 0; i < state.bandsStored; i++) {
                    const material = createSliceMaterial();
                    material.uniforms.u_mask.value = maskTexture;
                    const plane = new THREE.Mesh(planeGeometry, material);
                    const group = new THREE.Group();
                    group.scale.set(1, 1, 1);

                    addBZWireframe(group);

                    bandMaterials.push(material);
                    bandPlanes.push(plane);
                    bandGroups.push(group);
                    scene.add(group);
                    scene.add(plane);
                }
            }

            function setBandFromUI() {
                state.currentBand = parseInt(bandSel.value, 10);
                bandValue.textContent = String(state.currentBand);
                updateBandVisibility();
                layoutBands();
                fitCameraToView();
                updateLegend();
                updateBandLegendPositions();
                updateWorldToTex();
            }

            function updateBandVisibility() {
                const single = state.viewMode === "single";
                for (let i = 0; i < bandGroups.length; i++) {
                    const visible = single ? i === state.currentBand : true;
                    bandGroups[i].visible = visible;
                    bandPlanes[i].visible = visible;
                }
            }

            function setViewMode(mode) {
                state.viewMode = mode;
                bandControl.hidden = false;
                bandCountRow.hidden = mode !== "multi";
                bandSel.disabled = mode !== "single";
                bandControl.style.opacity = mode === "single" ? "1" : "0.4";
                bandControl.style.pointerEvents =
                    mode === "single" ? "auto" : "none";
                updateBandVisibility();
                layoutBands();
                fitCameraToView();
                updateBandLegendVisibility();
                updateLegend();
                updateBandLegendPositions();
                updateWorldToTex();
            }

            function layoutBands() {
                const count = state.bandsStored;
                if (count === 0) return;
                if (state.viewMode === "single") {
                    const i = Math.min(
                        Math.max(state.currentBand, 0),
                        count - 1,
                    );
                    bandGroups[i].position.set(0, 0, 0);
                    bandPlanes[i].position.set(0, 0, 0);
                    bandGroups[i].updateMatrixWorld(true);
                    return;
                }
                const cols = Math.min(4, count);
                const rows = Math.ceil(count / cols);
                const spacing = 2.6;
                const offsetX = -((cols - 1) * spacing) / 2;
                const offsetY = ((rows - 1) * spacing) / 2;

                for (let i = 0; i < count; i++) {
                    const col = i % cols;
                    const row = Math.floor(i / cols);
                    const x = offsetX + col * spacing;
                    const y = offsetY - row * spacing;
                    bandGroups[i].position.set(x, y, 0);
                    bandPlanes[i].position.set(x, y, 0);
                    bandGroups[i].updateMatrixWorld(true);
                }
            }

            function fitCameraToView() {
                const count = state.bandsStored;
                if (count === 0) return;
                let halfWidth = 1;
                let halfHeight = 1;
                if (state.viewMode === "multi") {
                    const cols = Math.min(4, count);
                    const rows = Math.ceil(count / cols);
                    const spacing = 2.6;
                    halfWidth = ((cols - 1) * spacing) / 2 + 1;
                    halfHeight = ((rows - 1) * spacing) / 2 + 1;
                }
                const vFov = THREE.MathUtils.degToRad(camera.fov);
                const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
                const distForHeight = halfHeight / Math.tan(vFov / 2);
                const distForWidth = halfWidth / Math.tan(hFov / 2);
                const dist = Math.max(distForHeight, distForWidth) + 1.5;
                camera.position.set(0, 0, dist);
                camera.updateProjectionMatrix();
            }

            async function loadZarr(zarrUrl) {
                clearMsg();
                msg("Loading Zarr …");

                const baseURL = new URL(
                    zarrUrl.trim().endsWith("/")
                        ? zarrUrl.trim()
                        : zarrUrl.trim() + "/",
                    window.location.href,
                );

                const meta = await (
                    await fetch(new URL("meta.json", baseURL))
                ).json();

                state.bandsStored =
                    meta.bands_stored ??
                    meta.bandsStored ??
                    meta.band_minmax.length;
                state.bandMinMax = meta.band_minmax ?? meta.bandMinmax;
                state.nx = meta.grid_shape[0];
                state.ny = meta.grid_shape[1];
                state.nz = meta.grid_shape[2];

                const k0 = meta.origin,
                    dk = meta.spacing,
                    gs = meta.grid_shape;
                state.kMin.set(k0[0], k0[1], k0[2]);
                state.kMax.set(
                    k0[0] + dk[0] * (gs[0] - 1),
                    k0[1] + dk[1] * (gs[1] - 1),
                    k0[2] + dk[2] * (gs[2] - 1),
                );

                state.globalMinMax = [
                    Math.min(...state.bandMinMax.map((a) => a[0])),
                    Math.max(...state.bandMinMax.map((a) => a[1])),
                ];

                const store = new zarr.FetchStore(baseURL);
                const root = zarr.root(store);

                const group = await zarr.open.v3(root, { kind: "group" });
                const energiesArr = await zarr.open.v3(
                    group.resolve("energies"),
                    { kind: "array" },
                );
                const maskArr = await zarr.open.v3(group.resolve("bz_mask"), {
                    kind: "array",
                });

                state.energiesArray = energiesArr;
                state.maskArray = maskArr;

                state.energiesView = await zarr.get(energiesArr);
                state.maskView = await zarr.get(maskArr);

                bandCount.textContent = `All (${state.bandsStored})`;
                bandSel.min = "0";
                bandSel.max = String(Math.max(0, state.bandsStored - 1));
                bandSel.step = "1";
                state.currentBand = 0;
                bandSel.value = "0";
                bandValue.textContent = "0";

                const maskTexture = createMaskTexture();
                buildBands(maskTexture);
                buildBandLegends();

                for (let i = 0; i < state.bandsStored; i++) {
                    const tex = createBandTexture(i);
                    bandMaterials[i].uniforms.u_volume.value = tex;
                }

                updateEnergyRange();
                setPlaneSizeToCube();
                applyRotationToBands();
                setViewMode(state.viewMode);
                state.ready = true;
                updateBandLegendPositions();
                updateWorldToTex();

                clearMsg();
            }

            let bzGeom = null;
            let bzEdgesGeom = null;
            const bzWireMaterial = new THREE.LineBasicMaterial({
                color: 0xffffff,
                opacity: 1.0,
                transparent: true,
            });
            const bzMeshMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                opacity: 0.0,
                transparent: true,
                depthWrite: false,
            });

            function ensureBZGeometry() {
                if (bzGeom && bzEdgesGeom) return;

                const eps = 1e-6;

                const planes = [
                    { A: [1, 0, 0], b: 1 },
                    { A: [-1, 0, 0], b: 1 },
                    { A: [0, 1, 0], b: 1 },
                    { A: [0, -1, 0], b: 1 },
                    { A: [0, 0, 1], b: 1 },
                    { A: [0, 0, -1], b: 1 },
                ];

                const signs = [-1, 1];
                for (const sx of signs)
                    for (const sy of signs)
                        for (const sz of signs) {
                            planes.push({ A: [sx, sy, sz], b: 1.5 });
                        }

                function inside(p) {
                    const x = p.x,
                        y = p.y,
                        z = p.z;
                    if (
                        Math.abs(x) > 1 + eps ||
                        Math.abs(y) > 1 + eps ||
                        Math.abs(z) > 1 + eps
                    )
                        return false;
                    for (const sx of signs)
                        for (const sy of signs)
                            for (const sz of signs) {
                                const s = sx * x + sy * y + sz * z;
                                if (Math.abs(s) > 1.5 + eps) return false;
                            }
                    return true;
                }

                function solve3(a1, a2, a3, b1, b2, b3) {
                    const M = new THREE.Matrix3().set(
                        a1[0],
                        a1[1],
                        a1[2],
                        a2[0],
                        a2[1],
                        a2[2],
                        a3[0],
                        a3[1],
                        a3[2],
                    );
                    const det = M.determinant();
                    if (Math.abs(det) < 1e-8) return null;
                    const inv = new THREE.Matrix3().copy(M).invert();
                    const v = new THREE.Vector3(b1, b2, b3).applyMatrix3(inv);
                    return v;
                }

                const pts = [];
                const seen = new Map();
                for (let i = 0; i < planes.length; i++) {
                    for (let j = i + 1; j < planes.length; j++) {
                        for (let k = j + 1; k < planes.length; k++) {
                            const p = solve3(
                                planes[i].A,
                                planes[j].A,
                                planes[k].A,
                                planes[i].b,
                                planes[j].b,
                                planes[k].b,
                            );
                            if (!p) continue;
                            if (!inside(p)) continue;
                            const key = `${Math.round(p.x * 1e6)},${Math.round(p.y * 1e6)},${Math.round(p.z * 1e6)}`;
                            if (seen.has(key)) continue;
                            seen.set(key, true);
                            pts.push(p);
                        }
                    }
                }

                bzGeom = new ConvexGeometry(pts);
                bzEdgesGeom = new THREE.EdgesGeometry(bzGeom);
            }

            function addBZWireframe(group) {
                ensureBZGeometry();
                const wire = new THREE.LineSegments(
                    bzEdgesGeom,
                    bzWireMaterial,
                );
                wire.name = "bzWire";
                group.add(wire);

                const mesh = new THREE.Mesh(bzGeom, bzMeshMaterial);
                mesh.name = "bzMesh";
                group.add(mesh);
            }

            function orientPlanesToCamera() {
                for (const plane of bandPlanes) {
                    plane.quaternion.copy(camera.quaternion);
                }
            }

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                if (state.autoRotate && state.ready && !dragging) {
                    tempQuat.setFromAxisAngle(
                        autoRotateAxis,
                        delta * autoRotateSpeed,
                    );
                    rotationQuat.premultiply(tempQuat);
                    applyRotationToBands();
                }
                orientPlanesToCamera();
                updateBandLegendPositions();
                controls.update();
                renderer.render(scene, camera);
            }

            function ensureLegend() {
                let legend = document.getElementById("legend");
                if (!legend) {
                    legend = document.createElement("div");
                    legend.id = "legend";
                    const canvas = document.createElement("canvas");
                    canvas.id = "legendCanvas";
                    canvas.width = 100;
                    canvas.height = 260;
                    legend.appendChild(canvas);
                    container.appendChild(legend);
                }
                return /** @type {HTMLCanvasElement} */ (
                    document.getElementById("legendCanvas")
                );
            }

            function jsColormap(t) {
                t = Math.max(0, Math.min(1, t));
                if (t < 0.5) {
                    const b = Math.round(255 * (2.0 * (0.5 - t)));
                    return [0, 0, b];
                } else {
                    const r = Math.round(255 * (2.0 * (t - 0.5)));
                    return [r, 0, 0];
                }
            }

            function fmtEV(x) {
                const ax = Math.abs(x);
                if (ax >= 100) return x.toFixed(0);
                if (ax >= 10) return x.toFixed(1);
                if (ax >= 1) return x.toFixed(2);
                return x.toFixed(3);
            }

            function drawBandLegend(canvas, emin, emax) {
                const ctx = canvas.getContext("2d");
                if (!ctx) return;
                const W = canvas.width;
                const H = canvas.height;
                ctx.clearRect(0, 0, W, H);
                const range = Math.max(1e-12, emax - emin);
                for (let y = 0; y < H; y++) {
                    const t = 1 - y / (H - 1);
                    const E = emin + t * range;
                    const tCol = (E - emin) / range;
                    const [r, g, b] = jsColormap(tCol);
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(0, y, W, 1);
                }
                ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.lineWidth = 1;
                ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
            }

            function updateLegend() {
                const legend = document.getElementById("legend");
                if (state.bandMinMax.length === 0) {
                    if (legend) legend.style.display = "none";
                    return;
                }
                if (state.viewMode === "multi") {
                    if (state.normMode !== "global") {
                        if (legend) legend.style.display = "none";
                        return;
                    }
                    const canvas = ensureLegend();
                    if (legend) legend.style.display = "block";
                    const ctx = canvas.getContext("2d");
                    if (!ctx) return;

                    const W = canvas.width,
                        H = canvas.height;
                    ctx.clearRect(0, 0, W, H);

                    const padTop = 10,
                        padBot = 12,
                        padLeft = 8,
                        gap = 8;
                    const barW = 22;
                    const barX = padLeft;
                    const y0 = padTop;
                    const y1 = H - padBot;
                    const labelX = barX + barW + gap;

                    const [gMin, gMax] = state.globalMinMax;
                    const gRange = Math.max(1e-12, gMax - gMin);

                    function yForE(E) {
                        const t = (E - gMin) / gRange;
                        return y1 - t * (y1 - y0);
                    }

                    ctx.fillStyle = "rgba(255,255,255,0.12)";
                    ctx.fillRect(barX, y0, barW, y1 - y0);

                    const yy0 = Math.round(
                        Math.max(y0, Math.min(y1, yForE(gMax))),
                    );
                    const yy1 = Math.round(
                        Math.max(y0, Math.min(y1, yForE(gMin))),
                    );
                    for (let y = yy0; y <= yy1; y++) {
                        const tGlob = (y1 - y) / (y1 - y0);
                        const E = gMin + tGlob * gRange;
                        const tCol = (E - gMin) / gRange;
                        const [r, g, b] = jsColormap(tCol);
                        ctx.fillStyle = `rgb(${r},${g},${b})`;
                        ctx.fillRect(barX, y, barW, 1);
                    }

                    ctx.strokeStyle = "rgba(255,255,255,0.6)";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(barX + 0.5, y0 + 0.5, barW, y1 - y0);

                    ctx.font =
                        "12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
                    ctx.textBaseline = "middle";
                    ctx.fillStyle = "#fff";

                    function tick(y, text, strong = false) {
                        ctx.strokeStyle = strong
                            ? "rgba(255,255,255,0.9)"
                            : "rgba(255,255,255,0.5)";
                        ctx.beginPath();
                        ctx.moveTo(barX + barW + 2, Math.round(y) + 0.5);
                        ctx.lineTo(barX + barW + 8, Math.round(y) + 0.5);
                        ctx.stroke();
                        ctx.fillText(text, labelX, y);
                    }

                    tick(yForE(gMax), `${fmtEV(gMax)} eV`);
                    tick(yForE(gMin), `${fmtEV(gMin)} eV`);
                    return;
                }

                const canvas = ensureLegend();
                if (legend) legend.style.display = "block";
                const ctx = canvas.getContext("2d");
                if (!ctx) return;

                const W = canvas.width,
                    H = canvas.height;
                ctx.clearRect(0, 0, W, H);

                const padTop = 10,
                    padBot = 12,
                    padLeft = 8,
                    gap = 8;
                const barW = 22;
                const barX = padLeft;
                const y0 = padTop;
                const y1 = H - padBot;
                const labelX = barX + barW + gap;

                const [gMin, gMax] = state.globalMinMax;
                const [cMin, cMax] =
                    state.normMode === "band"
                        ? state.bandMinMax[state.currentBand]
                        : state.globalMinMax;

                const gRange = Math.max(1e-12, gMax - gMin);
                const cRange = Math.max(1e-12, cMax - cMin);

                function yForE(E) {
                    const t = (E - gMin) / gRange;
                    return y1 - t * (y1 - y0);
                }

                ctx.fillStyle = "rgba(255,255,255,0.12)";
                ctx.fillRect(barX, y0, barW, y1 - y0);

                const yy0 = Math.round(Math.max(y0, Math.min(y1, yForE(cMax))));
                const yy1 = Math.round(Math.max(y0, Math.min(y1, yForE(cMin))));
                for (let y = yy0; y <= yy1; y++) {
                    const tGlob = (y1 - y) / (y1 - y0);
                    const E = gMin + tGlob * gRange;
                    const tCol = (E - cMin) / cRange;
                    const [r, g, b] = jsColormap(tCol);
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(barX, y, barW, 1);
                }

                ctx.strokeStyle = "rgba(255,255,255,0.6)";
                ctx.lineWidth = 1;
                ctx.strokeRect(barX + 0.5, y0 + 0.5, barW, y1 - y0);

                ctx.font =
                    "12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#fff";

                function tick(y, text, strong = false) {
                    ctx.strokeStyle = strong
                        ? "rgba(255,255,255,0.9)"
                        : "rgba(255,255,255,0.5)";
                    ctx.beginPath();
                    ctx.moveTo(barX + barW + 2, Math.round(y) + 0.5);
                    ctx.lineTo(barX + barW + 8, Math.round(y) + 0.5);
                    ctx.stroke();
                    ctx.fillText(text, labelX, y);
                }

                tick(yForE(gMax), `${fmtEV(gMax)} eV`);
                tick(yForE(gMin), `${fmtEV(gMin)} eV`);
                tick(yForE(cMax), `${fmtEV(cMax)} eV`, true);
                tick(yForE(cMin), `${fmtEV(cMin)} eV`, true);
            }

            async function boot() {
                if (!checkWebGL2()) return;
                state.ready = false;
                rotationQuat.identity();
                await loadZarr(state.zarrUrl);
            }

            boot();
            animate();
        </script>
    </body>
</html>
