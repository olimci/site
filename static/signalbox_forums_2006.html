        <title>Signalbox Forums - The Computer Enthusiast Community</title>

        <style>
            /* Signalbox 2006 - a deliberately fixed-width, bitmap-skinned forum layout. */
            html {
                background: #d5dce5;
            }
            body {
                margin: 0;
                padding: 0;
                background: #d5dce5;
                color: #2d3b4b;
                font:
                    11px Tahoma,
                    Verdana,
                    Arial,
                    sans-serif;
            }
            a {
                color: #214f80;
                text-decoration: none;
            }
            a:visited {
                color: #38537a;
            }
            a:hover {
                color: #ba5e13;
                text-decoration: underline;
            }
            img {
                border: 0;
                vertical-align: middle;
            }
            form {
                margin: 0;
            }
            input,
            select,
            textarea,
            button {
                font:
                    11px Tahoma,
                    Verdana,
                    Arial,
                    sans-serif;
                color: #243449;
            }
            input[type="text"],
            input[type="password"],
            select,
            textarea {
                border: 1px solid #91a5b9;
                border-top-color: #697f95;
                background: #fff;
                padding: 3px 4px;
            }
            input[type="checkbox"] {
                vertical-align: middle;
            }
            button,
            input[type="submit"] {
                cursor: pointer;
            }
            hr {
                border: 0;
                border-top: 1px solid #c0cddd;
                height: 0;
            }
            #page {
                width: 950px;
                margin: 13px auto 25px;
                padding: 8px;
                border: 1px solid #7b91a7;
                outline: 1px solid #f6f9fc;
                background: #fff;
            }
            .topline {
                height: 20px;
                line-height: 18px;
                overflow: hidden;
                font-size: 10px;
                color: #536578;
            }
            .topline .right {
                float: right;
            }
            .topline b {
                color: #31587b;
            }

            const byId = (id) => FORUMS.find((f) => f.id === id);
            const member = (id) =>
                MEMBERS.find((m) => m.id === id) || {
                    id,
                    title: "Member",
                    joined: "2006",
                    posts: "1",
                    location: "",
                    sig: "",
                    rank: "Member",
                    active: "Today",
                };
            const htmlEscape = (s) =>
                String(s == null ? "" : s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            const link = (href, s, attr = "") =>
                `<a href="${href}" ${attr}>${s}</a>`;
            const img = (name, alt = "", attr = "") =>
                `<img src="${ASSETS[name] || ""}" alt="${htmlEscape(alt)}" ${attr}>`;
            const fmtCount = (x) => Number(x).toLocaleString("en-GB");
            function getStore(k, def) {
                try {
                    let x = localStorage.getItem("signalbox." + k);
                    return x ? JSON.parse(x) : def;
                } catch (e) {
                    return def;
                }
            }
            function setStore(k, val) {
                try {
                    localStorage.setItem("signalbox." + k, JSON.stringify(val));
                } catch (e) {}
            }
            let added = getStore("threads", []);
            let read = getStore("read", []);
            let logged = getStore("logged", true);
            let subscriptions = getStore("subscriptions", []);
            let pms = getStore("pms", []);
            let quotedDraft = null,
                previewDraft = null;
            function allThreads() {
                return SEED.map(
                    (t) => added.find((a) => a.id === t.id) || t,
                ).concat(added.filter((a) => !SEED.some((t) => t.id === a.id)));
            }
            function thread(id) {
                return allThreads().find((t) => t.id === id);
            }
            function lastPost(t) {
                return t.posts[t.posts.length - 1];
            }
            function threadSort(a, b) {
                return (
                    (b.kind === "sticky") - (a.kind === "sticky") ||
                    lastPost(b).at.localeCompare(lastPost(a).at)
                );
            }
            function forumThreads(fid) {
                return allThreads()
                    .filter((t) => t.forum === fid)
                    .sort(threadSort);
            }
            function indexLast(fid) {
                return allThreads()
                    .filter((t) => t.forum === fid)
                    .sort((a, b) =>
                        lastPost(b).at.localeCompare(lastPost(a).at),
                    )[0];
            }
            function fmtDate(s) {
                if (!s) return "";
                let a = s.split("T"),
                    date = a[0],
                    hm = a[1] || "00:00",
                    parts = date.split("-"),
                    hour = +hm.slice(0, 2),
                    minute = hm.slice(3, 5),
                    amp = hour >= 12 ? "PM" : "AM";
                hour = hour % 12 || 12;
                let t = hour + ":" + minute + " " + amp;
                if (date === "2006-10-19") return "Today, " + t;
                if (date === "2006-10-18") return "Yesterday, " + t;
                return (
                    +parts[2] +
                    " " +
                    [
                        "Jan",
                        "Feb",
                        "Mar",
                        "Apr",
                        "May",
                        "Jun",
                        "Jul",
                        "Aug",
                        "Sep",
                        "Oct",
                        "Nov",
                        "Dec",
                    ][+parts[1] - 1] +
                    " 2006, " +
                    t
                );
            }
            const uname = (id) =>
                link("#member/" + encodeURIComponent(id), htmlEscape(id));
            function formattedBody(raw) {
                let s = htmlEscape(raw).replace(
                    /\[quote(?:=([^\]\n]+))?\]([\s\S]*?)\[\/quote\]/gi,
                    (_m, who, body) =>
                        `<div class="quote"><div class="quotehead">Originally posted by ${htmlEscape(who || "member")}:</div><div class="quoted">${body}</div></div>`,
                );
                s = s
                    .replace(/\[b\]([\s\S]*?)\[\/b\]/gi, "<b>$1</b>")
                    .replace(/\[i\]([\s\S]*?)\[\/i\]/gi, "<i>$1</i>")
                    .replace(/\[u\]([\s\S]*?)\[\/u\]/gi, "<u>$1</u>");
                s = s.replace(
                    /\[code\]([\s\S]*?)\[\/code\]/gi,
                    '<div class="codebox">$1</div>',
                );
                s = s.replace(
                    /\[url=(https?:\/\/[^\]\s]+)\]([\s\S]*?)\[\/url\]/gi,
                    (_m, url, body) =>
                        `<a href="${url.replace(/&amp;/g, "&")}" target="_blank" rel="noopener">${body}</a>`,
                );
                const emotes = {
                    ":)": "smile",
                    ";)": "wink",
                    ":D": "grin",
                    ":(": "sad",
                    "8)": "cool",
                    ":P": "grin",
                };
                s = s.replace(
                    /(^|[\s(])(:\)|;\)|:D|:\(|8\)|:P)(?=$|[\s.,!?<])/g,
                    (_m, b, sm) =>
                        b +
                        img(emotes[sm], sm, 'style="width:16px;height:16px"'),
                );
                s = s.replace(/\n/g, "<br>");
                return s;
            }
            function routeInfo() {
                let hash = decodeURIComponent(
                    location.hash.slice(1) || "index",
                );
                let [path] = hash.split("?");
                let [page, ...rest] = path.split("/");
                return { page, id: rest[0] || "" };
            }

                return `<div class="breadcrumb">${[link("#index", "Signalbox Forums"), ...items.map((item, i) => (i === items.length - 1 ? `<span class="last">${htmlEscape(item.text)}</span>` : link(item.href, htmlEscape(item.text))))].join('<span class="sep">&raquo;</span>')}</div>`;
            }

            }

                document.getElementById("app").innerHTML =
                    navigation() +
                    `<main class="main">${breadcrumbs(crumb)}${inner}</main>` +

            function idx() {
                let boxes = CATS.map((cat) => {
                    let rows = cat.forums
                        .map((id, i) => {
                            const f = byId(id),
                                last = indexLast(id),
                                p = lastPost(last),
                                isNew = f.kind === "new" && !read.includes(id);
                            return `<tr class="data ${i % 2 ? "alt" : ""}"><td class="forum-icon">${link("#forum/" + id, img(isNew ? "forum_new" : "forum_old", isNew ? "New posts" : "No new posts"))}</td><td><div class="forum-name">${link("#forum/" + id, htmlEscape(f.name))}</div><div class="desc">${htmlEscape(f.desc)}</div>${id === "hardware" ? `<div class="subforums">Sub-forums: ${link("#forum/hardware", "Case Modding")} · ${link("#forum/hardware", "Buying Advice")}</div>` : ""}</td><td class="counts">${fmtCount(f.threads)}</td><td class="counts">${fmtCount(f.posts)}</td><td class="lastpost">${link("#thread/" + last.id, htmlEscape(last.title))}<br><span class="time">${fmtDate(p.at)}</span> ${link("#thread/" + last.id, "»")}<br>by ${uname(p.author)}</td></tr>`;

                return {
                    crumb: [{ text: "Private Messages" }],
                    html: `<div class="boardtitle">Private Messages</div>${logged ? "" : `<div class="form-note">${link("#login", "Log in")} to view your private messages.</div>`}<table class="boxtable"><tbody><tr class="catbar"><td colspan="3">Inbox - ${pms.length} Messages</td></tr><tr class="colhead"><th style="width:95px">Status</th><th>Message</th><th style="width:150px">From</th></tr>${pms.map((p, i) => `<tr class="data ${i % 2 ? "alt" : ""}"><td>${p.read ? "Read" : "Unread"}</td><td><a href="#messages" data-action="read-pm" data-id="${i}">${htmlEscape(p.subject)}</a>${p.read ? `<br><span class="small muted">${htmlEscape(p.body)}</span>` : ""}</td><td>${htmlEscape(p.from)}</td></tr>`).join("") || '<tr class="data"><td colspan="3">Your inbox is empty.</td></tr>'}</tbody></table><form data-form="pm"><table class="editor-box"><tbody><tr><td class="legendhead" colspan="2">Send New Private Message</td></tr><tr><td class="labelcell">Recipient:</td><td><input name="to" class="long" value="${htmlEscape(to)}" required></td></tr><tr><td class="labelcell">Subject:</td><td><input name="subject" class="long" maxlength="90" required></td></tr><tr><td class="labelcell">Message:</td><td><textarea name="body" required style="min-height:90px"></textarea></td></tr><tr><td class="labelcell">&nbsp;</td><td><button class="postbutton" type="submit">Send Message</button></td></tr></tbody></table></form>`,
                };
            }
            function loginPage() {
                return {
                    crumb: [{ text: "Log In" }],
                    html: `<div class="boardtitle">Log In</div><form data-form="login"><table class="editor-box"><tbody><tr><td colspan="2" class="legendhead">Log in to Signalbox Forums</td></tr><tr><td class="labelcell">User Name:</td><td><input type="text" name="username" value="patchcable" required></td></tr><tr><td class="labelcell">Password:</td><td><input type="password" name="password" value="******" required><div class="tooltip">Demo account: enter any password.</div></td></tr><tr><td class="labelcell">&nbsp;</td><td><label><input type="checkbox" checked> Remember Me?</label> &nbsp; <button class="postbutton" type="submit">Log In</button></td></tr></tbody></table></form>`,
                };
            }
            function errorPage(msg) {
                return {
                    crumb: [{ text: "Message" }],
                    html: `<div class="boardtitle">Board Message</div><div class="form-note">${htmlEscape(msg)}. ${link("#index", "Return to forum index")}.</div>`,
                };
            }
            function render() {
                const r = routeInfo();
                let view;
                switch (r.page) {
                    case "index":
                        view = { crumb: [], html: idx() };
                        break;
                    case "forum":
                        view = forumPage(r.id);
                        break;
                    case "thread":
                        view = threadPage(r.id.split("?")[0]);
                        break;
                    case "newthread":
                        view = editorPage("newthread", r.id);
                        break;
                    case "reply":
                        view = editorPage("reply", r.id);
                        break;
                    case "members":
                        view = membersPage();
                        break;
                    case "member":
                        view = memberPage(r.id);
                        break;
                    case "recent":
                        view = recentPage();
                        break;
                    case "search":
                        view = searchPage(
                            decodeURIComponent(
                                (location.hash.match(/\?q=([^&]+)/) || [])[1] ||
                                    "",
                            ),
                        );
                        break;
                    case "calendar":
                        view = calendarPage();
                        break;
                    case "faq":
                        view = faqPage();
                        break;
                    case "usercp":
                        view = usercpPage();
                        break;
                    case "messages":
                        view = messagesPage();
                        break;
                    case "login":
                        view = loginPage();
                        break;
                    case "logout":
                        logged = false;
                        setStore("logged", false);
                        location.hash = "#login";
                        return;
                    default:
                        view = errorPage("This page could not be found");
                }
                page(view.html, view.crumb);
                document.title =
                    (view.crumb.length
                        ? view.crumb[view.crumb.length - 1].text + " - "
                        : "") + "Signalbox Forums";
                if (r.page === "forum")
                    document.title = byId(r.id).name + " - Signalbox Forums";
                window.scrollTo(0, 0);
            }
            function saveReply(t, body, subscribe) {
                const offset =
                    added.reduce((sum, t) => sum + t.posts.length, 0) +
                    SEED.reduce(
                        (sum, t) => sum + Math.max(0, t.posts.length - 1),
                        0,
                    );
                const n = offset % 12;
                const at =
                    "2006-10-19T21:" + String(48 + n).padStart(2, "0") + ":00";
                if (!added.some((t2) => t2.id === t.id)) {
                    let clone = JSON.parse(JSON.stringify(t));
                    clone.posts.push({ author: "patchcable", at, body });
                    added.push(clone);
                } else {
                    added
                        .find((t2) => t2.id === t.id)
                        .posts.push({ author: "patchcable", at, body });
                }
                if (subscribe && !subscriptions.includes(t.id)) {
                    subscriptions.push(t.id);
                    setStore("subscriptions", subscriptions);
                }
                setStore("threads", added);
            }
            function submitHandler(ev) {
                const form = ev.target.closest("form[data-form]");
                if (!form) return;
                ev.preventDefault();
                const fd = new FormData(form),
                    type = form.dataset.form;
                if (type === "quicksearch" || type === "search") {
                    location.hash =
                        "#search?q=" +
                        encodeURIComponent(String(fd.get("q") || ""));
                    render();
                    return;
                }
                if (type === "login") {
                    logged = true;
                    setStore("logged", true);
                    location.hash = "#index";
                    return;
                }
                if (type === "pm") {
                    const to = String(fd.get("to") || "").trim();
                    const sub = String(fd.get("subject") || "").trim(),
                        msg = String(fd.get("body") || "").trim();
                    if (!to || !sub || !msg) return;
                    pms.unshift({
                        from: "patchcable",
                        to,
                        subject: "Sent: " + sub,
                        body: msg,
                        read: true,
                    });
                    setStore("pms", pms);
                    render();
                    return;
                }
                if (!logged) {
                    location.hash = "#login";
                    return;
                }
                if (type === "reply" || type === "newthread") {
                    let body = String(fd.get("body") || "").trim();
                    if (!body) return;
                    const id = form.dataset.id;
                    if (type === "reply") {
                        let t = thread(id);
                        if (!t) return;
                        saveReply(t, body, fd.has("subscribe"));
                        location.hash = "#thread/" + t.id;
                        render();
                    } else {
                        let title = String(fd.get("title") || "").trim();
                        if (!title) return;
                        let id2 = "user-" + Date.now().toString(36);
                        added.push({
                            id: id2,
                            forum: id,
                            title,
                            kind: "normal",
                            views: 1,
                            posts: [
                                {
                                    author: "patchcable",
                                    at: "2006-10-19T21:48:00",
                                    body,
                                },
                            ],
                        });
                        setStore("threads", added);
                        location.hash = "#thread/" + id2;
                    }
                }
            }
            function insertAtTextarea(str, wrap, tag) {
                let a = closestArea();
                if (!a) return;
                a.focus();
                const st = a.selectionStart,
                    en = a.selectionEnd,
                    s = a.value;
                if (wrap) {
                    let sel = s.slice(st, en);
                    let s1 = "[" + tag + "]",
                        s2 = "[/" + tag + "]";
                    if (tag === "url") {
                        s1 = "[url=https://example.com]";
                    }
                    a.value = s.slice(0, st) + s1 + sel + s2 + s.slice(en);
                    a.setSelectionRange(
                        st + s1.length,
                        st + s1.length + sel.length,
                    );
                } else {
                    a.value = s.slice(0, st) + str + s.slice(en);
                    a.setSelectionRange(st + str.length, st + str.length);
                }
                a.dispatchEvent(new Event("input", { bubbles: true }));
            }
            function closestArea() {
                return document.activeElement?.tagName === "TEXTAREA"
                    ? document.activeElement
                    : document.querySelector('main textarea[name="body"]');
            }
            function clickHandler(ev) {
                let el = ev.target.closest("[data-action]");
                if (!el) return;
                let action = el.dataset.action;
                if (
                    [
                        "quote",
                        "mark-read",
                        "subscribe",
                        "unsubscribe",
                        "bb",
                        "smile",
                        "preview",
                        "preview-quick",
                        "top",
                        "print",
                        "read-pm",
                        "do-jump",
                        "display-options",
                    ].includes(action)
                )
                    ev.preventDefault();
                if (action === "quote") {
                    let t = thread(el.dataset.id),
                        p = t.posts[Number(el.dataset.post)];
                    quotedDraft = {
                        id: t.id,
                        body:
                            "[quote=" +
                            p.author +
                            "]" +
                            p.body +
                            "[/quote]\n\n",
                    };
                    location.hash = "#reply/" + t.id;
                } else if (action === "mark-read") {
                    read = FORUMS.map((f) => f.id);
                    setStore("read", read);
                    render();
                } else if (action === "subscribe") {
                    let id = el.dataset.id;
                    if (subscriptions.includes(id))
                        subscriptions = subscriptions.filter((x) => x !== id);
                    else subscriptions.push(id);
                    setStore("subscriptions", subscriptions);
                    render();
                } else if (action === "unsubscribe") {
                    subscriptions = subscriptions.filter(
                        (x) => x !== el.dataset.id,
                    );
                    setStore("subscriptions", subscriptions);
                    render();
                } else if (action === "bb") {
                    insertAtTextarea("", true, el.dataset.tag);
                } else if (action === "smile") {
                    insertAtTextarea(" " + el.dataset.smile + " ", false);
                } else if (action === "preview" || action === "preview-quick") {
                    let a = closestArea(),
                        loc = document.getElementById(
                            action === "preview"
                                ? "compose-preview"
                                : "quick-preview",
                        );
                    if (loc)
                        loc.innerHTML =
                            '<div class="boardtitle">Preview Post</div><table class="posttable"><tr><td class="posttext">' +
                            formattedBody((a && a.value) || "") +
                            "</td></tr></table>";
                } else if (action === "top") {
                    window.scrollTo({ top: 0, behavior: "instant" });
                } else if (action === "print") {
                    window.print();
                } else if (action === "read-pm") {
                    pms[Number(el.dataset.id)].read = true;
                    setStore("pms", pms);
                    render();
                } else if (action === "do-jump") {
                    let v = document.getElementById("jumpforum").value;
                    if (v) location.hash = v;
                } else if (action === "display-options") {
                    let d = document.querySelector(".listtools");
                    if (d)
                        d.insertAdjacentHTML(
                            "beforeend",
                            ' <span class="muted">Options updated.</span>',
                        );
                }
            }
            window.addEventListener("hashchange", render);
            document.addEventListener("submit", submitHandler);
            document.addEventListener("click", clickHandler);
            render();
        </script>
    </body>
</html>
