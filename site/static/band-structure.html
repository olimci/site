<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>BZ slice viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        html, body { height: 100%; margin: 0; }
        #app { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; }
        header {
            padding: 10px 12px; background: #111; color: #eee;
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        }
        label { font: 14px system-ui, sans-serif; display: inline-flex; align-items: center; gap: 6px; }
        select, input[type="radio"] { font: 14px system-ui, sans-serif; }
        #canvas { position: relative; }
        #msg {
            position: absolute; top: 12px; left: 12px; padding: 6px 8px;
            background: rgba(0,0,0,0.6); color: white; font: 12px/1.3 system-ui, sans-serif;
            border-radius: 4px; pointer-events: none;
        }
    </style>
</head>
<body>
<div id="app">
    <header>
        <label>
            Zarr URL:
            <input id="zarrUrl" size="40" value="fcc_bz_bands.zarr" />
        </label>
        <label>
            Band:
            <select id="band"></select>
        </label>
        <label title="Normalize by band min/max or the global min/max across stored bands">
            Norm:
            <label><input type="radio" name="norm" value="band" checked /> per‑band</label>
            <label><input type="radio" name="norm" value="global" /> global</label>
        </label>
        <button id="reload">Load</button>
    </header>
    <div id="canvas"></div>
</div>

<!-- add in <head> -->
<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.159.0/examples/jsm/"
      }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { ArcballControls } from 'three/examples/jsm/controls/ArcballControls.js';
    import { ConvexGeometry } from 'three/examples/jsm/geometries/ConvexGeometry.js';
    import * as zarr from "https://cdn.jsdelivr.net/npm/zarrita@0.5.0/+esm";

    const state = {
        zarrUrl: document.getElementById('zarrUrl').value,
        bandMinMax: [], globalMinMax: [0, 1],
        bandsStored: 0, nx: 0, ny: 0, nz: 0,
        kMin: new THREE.Vector3(), kMax: new THREE.Vector3(),
        energiesArray: null, maskArray: null,
        energiesView: null, maskView: null,
        currentBand: 0, normMode: 'band'
    };

    const bandSel = document.getElementById('band');
    const reloadBtn = document.getElementById('reload');
    document.querySelectorAll('input[name="norm"]').forEach(r =>
        r.addEventListener('change', (e) => { state.normMode = e.target.value; updateEnergyRange(); })
    );
    reloadBtn.onclick = () => { state.zarrUrl = document.getElementById('zarrUrl').value; boot(); };

    const container = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 1000);
    camera.position.set(0, 0, 3);

    const controls = new ArcballControls(camera, renderer.domElement, scene);
    controls.setGizmosVisible(false);
    controls.enablePan = false;
    controls.radiusFactor = 1.2;

    const sliceMaterial = new THREE.ShaderMaterial({
        glslVersion: THREE.GLSL3,
        uniforms: {
            u_worldToTex: { value: new THREE.Matrix4() },
            u_volume:     { value: null },
            u_mask:       { value: null },
            u_emin:       { value: 0.0 },
            u_invRange:   { value: 1.0 },
            u_opacity:    { value: 1.0 }
        },
        transparent: false,
        depthWrite: true,
        depthTest: true,
        side: THREE.DoubleSide,
        vertexShader: /* glsl */`
          varying vec3 vWorldPos;
          void main() {
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldPos = worldPos.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }`,
        fragmentShader: /* glsl */`
          precision highp float;
          precision highp sampler3D;
          in vec3 vWorldPos;
          uniform mat4 u_worldToTex;
          uniform sampler3D u_volume;
          uniform sampler3D u_mask;
          uniform float u_emin;
          uniform float u_invRange;
          uniform float u_opacity;
          out vec4 outColor;

          vec3 colormap(float t) {
            // simple blue -> cyan -> yellow -> red
            t = clamp(t, 0.0, 1.0);

            if (t < 0.5) {
                return vec3(0.0, 0.0, 2.0*(0.5-t));
            } else {
                return vec3(2.0*(t-0.5), 0.0, 0.0);
            }
          }

          void main() {
            vec3 tc = (u_worldToTex * vec4(vWorldPos, 1.0)).xyz;   // world -> texture [0,1]^3
            // clip outside the volume bounds
            if (any(lessThan(tc, vec3(0.0))) || any(greaterThan(tc, vec3(1.0)))) discard;

            float inBZ = texture(u_mask, tc).r;
            if (inBZ < 0.5) discard;

            float e = texture(u_volume, tc).r;
            float t = (e - u_emin) * u_invRange; // normalize
            vec3 rgb = colormap(t);
            outColor = vec4(rgb, u_opacity);
          }`
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2, 1, 1), sliceMaterial);
    plane.position.set(0, 0, 0);


    const volumeGroup = new THREE.Group();
    volumeGroup.position.set(0, 0, 0);
    volumeGroup.scale.set(1, 1, 1);

    scene.add(volumeGroup);
    scene.add(plane);

    const cubeEdges = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(2, 2, 2)),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: false, opacity: 1.0 })
    );
    volumeGroup.add(cubeEdges);

    let dragging = false, lastX = 0, lastY = 0;
    renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    renderer.domElement.addEventListener('pointerup', () => { dragging = false; });
    renderer.domElement.addEventListener('pointermove', e => {
        if (!dragging) return;
        const dx = (e.clientX - lastX) / 200;
        const dy = (e.clientY - lastY) / 200;
        lastX = e.clientX; lastY = e.clientY;
        volumeGroup.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), dx);
        volumeGroup.rotateOnWorldAxis(new THREE.Vector3(1, 0, 0), dy);
        updateWorldToTex();
    });

    window.addEventListener('resize', () => {
        renderer.setSize(container.clientWidth, container.clientHeight);
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
    });

    function msg(text) {
        let m = document.getElementById('msg');
        if (!m) { m = document.createElement('div'); m.id = 'msg'; container.appendChild(m); }
        m.textContent = text;
    }

    function clearMsg() {
        const m = document.getElementById('msg');
        if (m) m.remove();
    }

    function checkWebGL2() {
        const gl = renderer.getContext();
        const ok = gl instanceof WebGL2RenderingContext;
        if (!ok) msg('WebGL2 is required. Try a newer browser.');
        return ok;
    }

    function computeWorldToTex() {
        const worldToVolume = new THREE.Matrix4().copy(volumeGroup.matrixWorld).invert();

        const kMin = state.kMin, kMax = state.kMax;
        const kCenter = new THREE.Vector3(
            0.5 * (kMin.x + kMax.x),
            0.5 * (kMin.y + kMax.y),
            0.5 * (kMin.z + kMax.z)
        );
        const kHalfRange = new THREE.Vector3(
            0.5 * (kMax.x - kMin.x),
            0.5 * (kMax.y - kMin.y),
            0.5 * (kMax.z - kMin.z)
        );

        const volumeToK = new THREE.Matrix4().set(
            kHalfRange.x, 0,            0,            kCenter.x,
            0,            kHalfRange.y, 0,            kCenter.y,
            0,            0,            kHalfRange.z, kCenter.z,
            0,            0,            0,            1
        );

        const sx = 1.0 / (kMax.x - kMin.x);
        const sy = 1.0 / (kMax.y - kMin.y);
        const sz = 1.0 / (kMax.z - kMin.z);
        const kToTex = new THREE.Matrix4().set(
            sx, 0,  0,  -kMin.x * sx,
            0,  sy, 0,  -kMin.y * sy,
            0,  0,  sz, -kMin.z * sz,
            0,  0,  0,   1
        );

        return kToTex.multiply(volumeToK).multiply(worldToVolume);
    }

    function updateWorldToTex() {
        sliceMaterial.uniforms.u_worldToTex.value.copy(computeWorldToTex());
    }

    function setPlaneSizeToCube() {
        plane.scale.set(2, 2, 1);

        const rx = state.kMax.x - state.kMin.x;
        const ry = state.kMax.y - state.kMin.y;
        const rz = state.kMax.z - state.kMin.z;
        const maxr = Math.max(rx, ry, rz);
        cubeEdges.scale.set(rx / maxr, ry / maxr, rz / maxr);
    }

    function updateEnergyRange() {
        const b = state.currentBand;
        const [emin, emax] = state.normMode === 'band'
            ? state.bandMinMax[b]
            : state.globalMinMax;
        const invRange = 1.0 / Math.max(1e-12, emax - emin);
        sliceMaterial.uniforms.u_emin.value = emin;
        sliceMaterial.uniforms.u_invRange.value = invRange;
    }

    function toIndex3D(x, y, z, nx, ny, nz) { return x + nx * (y + ny * z); }
    function get4DIndex(b, x, y, z, nBands, nx, ny, nz) {
        return (((b * nx + x) * ny + y) * nz + z);
    }

    function uploadBandTo3DTexture(band) {
        const { nx, ny, nz, energiesView } = state;
        const E = energiesView.data;
        const texData = new Float32Array(nx * ny * nz);
        for (let z = 0; z < nz; z++) {
            for (let y = 0; y < ny; y++) {
                for (let x = 0; x < nx; x++) {
                    const v = E[get4DIndex(band, x, y, z, state.bandsStored, nx, ny, nz)];
                    texData[toIndex3D(x, y, z, nx, ny, nz)] = isNaN(v) ? 0 : v;
                }
            }
        }
        const tex = new THREE.Data3DTexture(texData, nx, ny, nz);
        tex.format = THREE.RedFormat;
        tex.type = THREE.FloatType;
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.wrapS = tex.wrapT = tex.wrapR = THREE.ClampToEdgeWrapping;
        tex.unpackAlignment = 1;
        tex.needsUpdate = true;
        sliceMaterial.uniforms.u_volume.value = tex;
    }

    function uploadMaskTo3DTexture() {
        const { nx, ny, nz, maskView } = state;
        const M = maskView.data;
        const texData = new Float32Array(nx * ny * nz);
        for (let z = 0; z < nz; z++) {
            for (let y = 0; y < ny; y++) {
                for (let x = 0; x < nx; x++) {
                    const v = M[(x * ny + y) * nz + z];
                    texData[x + nx * (y + ny * z)] = v ? 1.0 : 0.0;
                }
            }
        }
        const tex = new THREE.Data3DTexture(texData, nx, ny, nz);
        tex.format = THREE.RedFormat;
        tex.type = THREE.FloatType;
        tex.minFilter = THREE.NearestFilter;
        tex.magFilter = THREE.NearestFilter;
        tex.wrapS = tex.wrapT = tex.wrapR = THREE.ClampToEdgeWrapping;
        tex.unpackAlignment = 1;
        tex.needsUpdate = true;
        sliceMaterial.uniforms.u_mask.value = tex;
    }

    function fillBandSelector() {
        bandSel.innerHTML = '';
        for (let i = 0; i < state.bandsStored; i++) {
            const opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = `Band ${i}`;
            bandSel.appendChild(opt);
        }
        bandSel.onchange = () => {
            state.currentBand = parseInt(bandSel.value, 10);
            uploadBandTo3DTexture(state.currentBand);
            updateEnergyRange();
        };
    }

    async function loadZarr(zarrUrl) {
        clearMsg(); msg('Loading Zarr …');

        const baseURL = new URL(
            zarrUrl.trim().endsWith('/') ? zarrUrl.trim() : zarrUrl.trim() + '/',
            window.location.href
        );

        const meta = await (await fetch(new URL('meta.json', baseURL))).json();

        state.bandsStored = meta.bands_stored ?? meta.bandsStored ?? meta.band_minmax.length;
        state.bandMinMax  = meta.band_minmax ?? meta.bandMinmax;
        state.nx = meta.grid_shape[0]; state.ny = meta.grid_shape[1]; state.nz = meta.grid_shape[2];

        const k0 = meta.origin, dk = meta.spacing, gs = meta.grid_shape;
        state.kMin.set(k0[0], k0[1], k0[2]);
        state.kMax.set(k0[0] + dk[0]*(gs[0]-1), k0[1] + dk[1]*(gs[1]-1), k0[2] + dk[2]*(gs[2]-1));

        state.globalMinMax = [
            Math.min(...state.bandMinMax.map(a => a[0])),
            Math.max(...state.bandMinMax.map(a => a[1]))
        ];

        const store = new zarr.FetchStore(baseURL);
        const root  = zarr.root(store);

        const group       = await zarr.open.v3(root, { kind: 'group' });
        const energiesArr = await zarr.open.v3(group.resolve('energies'), { kind: 'array' });
        const maskArr     = await zarr.open.v3(group.resolve('bz_mask'),  { kind: 'array' });

        state.energiesArray = energiesArr;
        state.maskArray     = maskArr;

        state.energiesView = await zarr.get(energiesArr);
        state.maskView     = await zarr.get(maskArr);

        fillBandSelector();
        state.currentBand = 0;
        bandSel.value = '0';

        uploadMaskTo3DTexture();
        uploadBandTo3DTexture(0);
        updateEnergyRange();
        setPlaneSizeToCube();
        buildBZWireframe();
        updateWorldToTex();

        clearMsg();
    }

    function buildBZWireframe() {
        if (cubeEdges && cubeEdges.parent) cubeEdges.parent.remove(cubeEdges);

        const eps = 1e-6;

        const planes = [
            {A: [ 1, 0, 0], b:  1}, {A: [-1, 0, 0], b:  1},
            {A: [ 0, 1, 0], b:  1}, {A: [ 0,-1, 0], b:  1},
            {A: [ 0, 0, 1], b:  1}, {A: [ 0, 0,-1], b:  1},
        ];

        const signs = [-1, 1];
        for (const sx of signs) for (const sy of signs) for (const sz of signs) {
            planes.push({ A: [sx, sy, sz], b: 1.5 });
        }

        function inside(p) {
            const x = p.x, y = p.y, z = p.z;
            if (Math.abs(x) > 1 + eps || Math.abs(y) > 1 + eps || Math.abs(z) > 1 + eps) return false;
            for (const sx of signs) for (const sy of signs) for (const sz of signs) {
                const s = sx * x + sy * y + sz * z;
                if (Math.abs(s) > 1.5 + eps) return false;
            }
            return true;
        }

        function solve3(a1, a2, a3, b1, b2, b3) {
            const M = new THREE.Matrix3().set(
                a1[0], a1[1], a1[2],
                a2[0], a2[1], a2[2],
                a3[0], a3[1], a3[2]
            );
            const det = M.determinant();
            if (Math.abs(det) < 1e-8) return null;
            const inv = new THREE.Matrix3().copy(M).invert();
            const v = new THREE.Vector3(b1, b2, b3).applyMatrix3(inv);
            return v;
        }

        const pts = [];
        const seen = new Map();
        for (let i = 0; i < planes.length; i++) {
            for (let j = i + 1; j < planes.length; j++) {
                for (let k = j + 1; k < planes.length; k++) {
                    const p = solve3(planes[i].A, planes[j].A, planes[k].A,
                        planes[i].b, planes[j].b, planes[k].b);
                    if (!p) continue;
                    if (!inside(p)) continue;
                    const key = `${Math.round(p.x*1e6)},${Math.round(p.y*1e6)},${Math.round(p.z*1e6)}`;
                    if (seen.has(key)) continue;
                    seen.set(key, true);
                    pts.push(p);
                }
            }
        }

        const geom = new ConvexGeometry(pts);
        const wire = new THREE.LineSegments(
            new THREE.EdgesGeometry(geom),
            new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 1.0, transparent: true })
        );
        wire.name = 'bzWire';
        volumeGroup.add(wire);

        const mesh = new THREE.Mesh(
            geom,
            new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.00, transparent: true, depthWrite: false })
        );
        mesh.name = 'bzMesh';
        volumeGroup.add(mesh);
    }

    function orientPlaneToCamera() {
        plane.quaternion.copy(camera.quaternion);
    }

    function animate() {
        requestAnimationFrame(animate);
        orientPlaneToCamera();
        controls.update();
        renderer.render(scene, camera);
    }

    async function boot() {
        if (!checkWebGL2()) return;
        volumeGroup.rotation.set(0, 0, 0);
        await loadZarr(state.zarrUrl);
    }

    boot();
    animate();
</script>
</body>
</html>
